<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1c"><title>NEON DODGE — Arcade Game</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#1b2453,#090d1c 65%);color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px}main{width:min(100%,540px)}h1{font-size:clamp(30px,7vw,46px);letter-spacing:3px;margin:6px 0;background:linear-gradient(90deg,#4bf9ff,#e85bff);color:transparent;background-clip:text}p{color:#aeb7d5}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border:1px solid #394268;background:#141b35;border-radius:18px;padding:10px 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stats b{display:block;font-size:23px;color:#5cf6fa}canvas{display:block;width:100%;height:auto;border-radius:20px;border:2px solid #374779;box-shadow:0 0 45px #2859f933;touch-action:none;background:#090f24}.controls{display:flex;gap:12px;margin-top:14px}button{cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:800;color:#091023;background:#65f6ff;flex:1;font-size:16px}button.secondary{background:#252f57;color:white;border:1px solid #45527d}.tip{font-size:13px;text-align:center;line-height:1.7}#status{font-weight:700;color:#ffdb70}.foot{text-align:center;color:#7784a8;font-size:12px;margin-top:20px}</style></head><body><main><div class="top"><div><h1>NEON DODGE</h1><p>หลบอุกกาบาต เก็บดาว ทำคะแนนให้สูงที่สุด!</p></div><span class="pill">⚡ ARCADE</span></div><div class="stats"><div class="pill">SCORE<b id="score">0</b></div><div class="pill">BEST<b id="best">0</b></div><div class="pill">LIVES<b id="lives">3</b></div></div><canvas id="game" width="480" height="620" aria-label="Neon Dodge game"></canvas><div class="controls"><button id="start">▶ เริ่มเล่น</button><button class="secondary" id="pause">⏸ พักเกม</button><button class="secondary" id="share">แชร์คะแนน</button></div><p class="tip">คอมพิวเตอร์: ← → หรือ A / D | มือถือ: ลากนิ้วบนพื้นที่เกม<br><span id="status">กดเริ่มเล่นเพื่อเข้าสู่เกม</span></p><div class="foot">NEON DODGE · Built with HTML Canvas · No login required</div></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);let best=Number(localStorage.getItem('neon-dodge-best')||0);$('best').textContent=best;let score=0,lives=3,playing=false,paused=false,player={x:240,y:560,r:17},objects=[],particles=[],keys=new Set(),last=0,spawn=0,invincible=0,elapsed=0;const W=480,H=620;function reset(){score=0;lives=3;elapsed=0;spawn=0;invincible=0;objects=[];particles=[];player.x=240;playing=true;paused=false;last=performance.now();$('start').textContent='↻ เริ่มใหม่';$('pause').textContent='⏸ พักเกม';$('status').textContent='เก็บดาวสีทอง +25 คะแนน | หลบอุกกาบาตสีชมพู';update();}function update(){$('score').textContent=Math.floor(score);$('lives').textContent=lives;if(score>best){best=Math.floor(score);localStorage.setItem('neon-dodge-best',String(best));$('best').textContent=best;}}function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.5,color});}function end(){playing=false;$('status').textContent='GAME OVER — คะแนน '+Math.floor(score)+' | กดเริ่มใหม่เพื่อเล่นอีกครั้ง';}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080f25';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#20315a';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(let i=0;i<45;i++){const x=(i*137+29)%W,y=(i*83+Math.floor(elapsed*18))%H;ctx.fillStyle='#7b9bff77';ctx.fillRect(x,y,2,2);}for(const o of objects){ctx.save();ctx.shadowBlur=22;ctx.shadowColor=o.good?'#ffe26a':'#ff3e9a';ctx.fillStyle=o.good?'#ffe26a':'#ff4a9c';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.restore();if(o.good){ctx.fillStyle='#fff8cc';ctx.font='19px sans-serif';ctx.textAlign='center';ctx.fillText('★',o.x,o.y+7);}}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);}ctx.globalAlpha=1;if(invincible<=0||Math.floor(invincible*12)%2===0){ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#54f6ff';ctx.shadowBlur=30;ctx.fillStyle='#55efff';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(19,19);ctx.lineTo(0,10);ctx.lineTo(-19,19);ctx.closePath();ctx.fill();ctx.restore();}if(!playing||paused){ctx.fillStyle='#05091bba';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 36px system-ui';ctx.fillText(!playing?(score?'GAME OVER':'NEON DODGE'):'PAUSED',W/2,H/2-10);ctx.font='17px system-ui';ctx.fillStyle='#9ef6ff';ctx.fillText(!playing?'Press Start to play':'Press Resume to continue',W/2,H/2+30);}}function frame(t){let dt=Math.min((t-last)/1000,.05)||0;last=t;if(playing&&!paused){elapsed+=dt;score+=dt*8;invincible=Math.max(0,invincible-dt);let move=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);player.x=Math.max(22,Math.min(W-22,player.x+move*340*dt));spawn-=dt;if(spawn<=0){const good=Math.random()<.28;objects.push({x:25+Math.random()*(W-50),y:-25,r:good?13:15+Math.random()*9,good,speed:145+Math.min(elapsed*4,190)+Math.random()*70});spawn=Math.max(.22,.72-elapsed*.007);}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=o.speed*dt;if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+15){objects.splice(i,1);if(o.good){score+=25;burst(o.x,o.y,'#ffe26a');}else if(invincible<=0){lives--;invincible=1.3;burst(o.x,o.y,'#ff4a9c');if(lives<=0)end();}}else if(o.y>H+40)objects.splice(i,1);}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}update();}draw();requestAnimationFrame(frame);}function pointer(e){const r=canvas.getBoundingClientRect();player.x=Math.max(22,Math.min(W-22,(e.clientX-r.left)/r.width*W));}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer(e);});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e);});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' '&&playing){paused=!paused;}});window.addEventListener('keyup',e=>keys.delete(e.key));$('start').onclick=reset;$('pause').onclick=()=>{if(!playing)return;paused=!paused;$('pause').textContent=paused?'▶ เล่นต่อ':'⏸ พักเกม';$('status').textContent=paused?'เกมหยุดชั่วคราว':'ลุยต่อ!';};$('share').onclick=async()=>{const message='ฉันทำได้ '+Math.floor(score)+' คะแนนใน NEON DODGE! มาแข่งกัน '+location.href;try{if(navigator.share)await navigator.share({title:'NEON DODGE',text:message,url:location.href});else{await navigator.clipboard.writeText(message);$('status').textContent='คัดลอกลิงก์และคะแนนแล้ว!';}}catch(e){if(e.name!=='AbortError')$('status').textContent='แชร์ไม่ได้ ลองคัดลอก URL จากแถบที่อยู่';}};requestAnimationFrame(frame);})();
</script></body></html>
